<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM 数据清洗、去重与 MinHash</title><link rel="stylesheet" href="../utils/viz.css"></head><body><main class="app"><nav><a href="../README.md">nano-nlp</a><span>2019–2026</span></nav><h1>15 · LLM 数据清洗、去重与 MinHash</h1><p class="lead">为什么数据过滤和近似去重会直接影响 NLP 训练质量？</p><section class="formula"><strong>核心方法</strong><p>先内容标准化、Exact Dedup，再通过词 n-gram 集合 MinHash/LSH 查找高度相似的文档，最后保留代表文本。</p><code>P[MinHash(A)=MinHash(B)] = Jaccard(A,B)</code></section><section class="workbench"><div class="toolbar"><button id="prev">← 上一步</button><span id="counter"></span><button id="next">下一步 →</button></div><div id="pipeline" class="pipeline"></div><div class="detail"><h2 id="step-name"></h2><p id="step-desc"></p><p class="code-label">对应实现</p><pre id="step-code"></pre></div></section><section class="note"><b>边界条件</b><p>MinHash/LSH 是概率近似；本例短文本仅用于机制验证，生产需外部排序、分片和质量分层。</p><a href="demo.py">demo.py</a> · <a href="README.md">README</a></section></main><script type="application/json" id="lesson">{"title":"LLM 数据清洗、去重与 MinHash","era":"2019–2026","question":"为什么数据过滤和近似去重会直接影响 NLP 训练质量？","idea":"先内容标准化、Exact Dedup，再通过词 n-gram 集合 MinHash/LSH 查找高度相似的文档，最后保留代表文本。","formula":"P[MinHash(A)=MinHash(B)] = Jaccard(A,B)","steps":[{"label":"规范化","desc":"小写并统一空白，减少格式差异","code":"normalize(text)"},{"label":"精确去重","desc":"以规范化内容哈希过滤完全重复项","code":"hashlib.sha256(...)"},{"label":"局部 shingles","desc":"按词构造集合以比较重叠率","code":"shingles(text, n=2)"},{"label":"MinHash 签名","desc":"多个稳定哈希排列得到集合摘要","code":"min(hash(seed, shingle))"},{"label":"LSH 分桶","desc":"匹配任何一个 band 的签名获得候选","code":"bands(signature)"},{"label":"代表选择","desc":"保留最早的未命中样本；生产需优先级策略","code":"kept.append(doc)"}],"pitfall":"MinHash/LSH 是概率近似；本例短文本仅用于机制验证，生产需外部排序、分片和质量分层。","source":"https://huggingface.co/datasets/Salesforce/wikitext"}</script><script src="../utils/viz.js"></script><script src="../utils/v2viz.js"></script><script src="visuali
