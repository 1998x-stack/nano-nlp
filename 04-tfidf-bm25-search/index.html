<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TF-IDF 与 BM25 信息检索 · nano-nlp</title><link rel="stylesheet" href="../utils/viz.css"></head><body><main class="app"><nav><a href="../README.md">nano-nlp</a><span>1970s–2000s</span></nav><h1>04 · TF-IDF 与 BM25 信息检索</h1><p class="lead">为什么一个词既要看文档内频率，也要看整个语料中的稀缺程度？</p><section class="formula"><strong>核心逻辑</strong><p>BM25 综合词频饱和、文档长度归一化和逆文档频率，代表了可解释的传统搜索排序方法。</p><code>score=Σ IDF(q)·tf(k1+1)/(tf+k1(1-b+b·dl/avgdl))</code></section><section class="workbench"><div class="toolbar"><button id="prev">← 上一步</button><span id="counter"></span><button id="next">下一步 →</button></div><div id="pipeline" class="pipeline"></div><div class="detail"><h2 id="step-name"></h2><p id="step-desc"></p><p class="code-label">对应 Python 代码锚点</p><pre id="step-code"></pre></div></section><section class="note"><b>思考边界</b><p>BM25 不理解同义改写或语义；但作为 Hybrid Search 的稀疏分支依然非常实用。</p><a href="demo.py">阅读可运行 demo.py</a> · <a href="README.md">阅读本章 README</a></section></main><script type="application/json" id="lesson">{"title":"TF-IDF 与 BM25 信息检索","era":"1970s–2000s","question":"为什么一个词既要看文档内频率，也要看整个语料中的稀缺程度？","idea":"BM25 综合词频饱和、文档长度归一化和逆文档频率，代表了可解释的传统搜索排序方法。","formula":"score=Σ IDF(q)·tf(k1+1)/(tf+k1(1-b+b·dl/avgdl))","steps":[{"label":"建索引","desc":"词项映射到包含它的文档集合","code":"df[token]"},{"label":"计算 IDF","desc":"越少文档包含该词，区分能力越强","code":"log(1+(N-df+0.5)/(df+0.5))"},{"label":"词频饱和","desc":"同一词重复出现的边际收益递减","code":"tf*(k1+1)/(tf+K)"},{"label":"长度校正","desc":"长文不应仅因更长而获得更高分","code":"K=k1*(1-b+b*dl/avgdl)"}],"pitfall":"BM25 不理解同义改写或语义；但作为 Hybrid Search 的稀疏分支依然非常实用。","source":"https://huggingface.co/datasets/rajpurkar/squad"}</script><script src="../utils/viz.js"></script></body></html>
