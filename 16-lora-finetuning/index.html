<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoRA 参数高效微调</title><link rel="stylesheet" href="../utils/viz.css"></head><body><main class="app"><nav><a href="../README.md">nano-nlp</a><span>2021–2023</span></nav><h1>16 · LoRA 参数高效微调</h1><p class="lead">微调 LLM 时，为什么可以只训练极少量的低秩参数？</p><section class="formula"><strong>核心方法</strong><p>冻结预训练权重 W，只学习低秩增量 BA 并通过缩放系数叠加到线性层输出。</p><code>y = Wx + (α/r)BAx</code></section><section class="workbench"><div class="toolbar"><button id="prev">← 上一步</button><span id="counter"></span><button id="next">下一步 →</button></div><div id="pipeline" class="pipeline"></div><div class="detail"><h2 id="step-name"></h2><p id="step-desc"></p><p class="code-label">对应实现</p><pre id="step-code"></pre></div></section><section class="note"><b>边界条件</b><p>真正的 LoRA 微调需要选择注意力/FFN 投影、考虑 rank 与任务、保存 adapter，并与量化和 tokenizer 配合。</p><a href="demo.py">demo.py</a> · <a href="README.md">README</a></section></main><script type="application/json" id="lesson">{"title":"LoRA 参数高效微调","era":"2021–2023","question":"微调 LLM 时，为什么可以只训练极少量的低秩参数？","idea":"冻结预训练权重 W，只学习低秩增量 BA 并通过缩放系数叠加到线性层输出。","formula":"y = Wx + (α/r)BAx","steps":[{"label":"冻结基座","desc":"W 的 requires_grad=False，避免全参数更新","code":"self.base.weight.requires_grad_(False)"},{"label":"低秩矩阵","desc":"训练 A: in→rank，B: rank→out","code":"self.A, self.B"},{"label":"前向叠加","desc":"base(x) + B(A(x))*alpha/r","code":"self.base(x) + self.B(self.A(x))*..."},{"label":"只优化 adapter","desc":"优化器仅接收 A、B 参数","code":"optimizer = AdamW([*lora.A.parameters(), ...])"},{"label":"统计可训练比","desc":"对比可训练参数与总参数","code":"trainable, total"}],"pitfall":"真正的 LoRA 微调需要选择注意力/FFN 投影、考虑 rank 与任务、保存 adapter，并与量化和 tokenizer 配合。","source":"https://huggingface.co/datasets/stanfordnlp/sst2"}</script><script src="../utils/viz.js"></script></body></html>
