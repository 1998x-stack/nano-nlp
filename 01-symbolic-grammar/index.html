<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>符号规则与上下文无关文法 · nano-nlp</title><link rel="stylesheet" href="../utils/viz.css"></head><body><main class="app"><nav><a href="../README.md">nano-nlp</a><span>1950s–1980s</span></nav><h1>01 · 符号规则与上下文无关文法</h1><p class="lead">人工规则如何明确描述句子结构？</p><section class="formula"><strong>核心逻辑</strong><p>CFG 将语法拆成可递归组合的非终结符；递归下降分析器遍历产生式并返回成功的结构树。</p><code>S → NP VP；NP → Det N；VP → V NP</code></section><section class="workbench"><div class="toolbar"><button id="prev">← 上一步</button><span id="counter"></span><button id="next">下一步 →</button></div><div id="pipeline" class="pipeline"></div><div class="detail"><h2 id="step-name"></h2><p id="step-desc"></p><p class="code-label">对应 Python 代码锚点</p><pre id="step-code"></pre></div></section><section class="note"><b>思考边界</b><p>规则不等于语义理解；文法覆盖率和歧义会随语言规模急剧增长。</p><a href="demo.py">阅读可运行 demo.py</a> · <a href="README.md">阅读本章 README</a></section></main><script type="application/json" id="lesson">{"title":"符号规则与上下文无关文法","era":"1950s–1980s","question":"人工规则如何明确描述句子结构？","idea":"CFG 将语法拆成可递归组合的非终结符；递归下降分析器遍历产生式并返回成功的结构树。","formula":"S → NP VP；NP → Det N；VP → V NP","steps":[{"label":"词汇规则","desc":"终结符如 the/cat/sees 指向词类 Det/N/V","code":"GRAMMAR['N']"},{"label":"递归展开","desc":"从 S 出发尝试 NP 与 VP 两个分支","code":"parse_symbol('S', tokens, 0)"},{"label":"边界匹配","desc":"终结符必须与输入 token 精确匹配","code":"if symbol == tokens[pos]"},{"label":"得到句法树","desc":"所有输入消耗完毕才接受句子","code":"end == len(tokens)"}],"pitfall":"规则不等于语义理解；文法覆盖率和歧义会随语言规模急剧增长。","source":"https://huggingface.co/datasets/nyu-mll/glue"}</script><script src="../utils/viz.js"></script></body></html>
