<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transformer Self-Attention 机制 · nano-nlp</title><link rel="stylesheet" href="../utils/viz.css"></head><body><main class="app"><nav><a href="../README.md">nano-nlp</a><span>2017</span></nav><h1>08 · Transformer Self-Attention 机制</h1><p class="lead">如何去掉 RNN，使任意两个 token 可以直接交互并进行并行计算？</p><section class="formula"><strong>核心计算</strong><p>Q/K/V 线性投影、缩放点积、Softmax、因果掩码、多头拼接，是 Decoder Transformer 的计算内核。</p><code>softmax(Q Kᵀ / √d_k + causal_mask) V</code></section><section class="workbench"><div class="toolbar"><button id="prev">← 上一步</button><span id="counter"></span><button id="next">下一步 →</button></div><div id="pipeline" class="pipeline"></div><div class="detail"><h2 id="step-name"></h2><p id="step-desc"></p><p class="code-label">代码定位</p><pre id="step-code"></pre></div></section><section class="note"><b>最容易误解的地方</b><p>Self-Attention 本身不包含位置概念；需要显式位置编码或其他位置机制。本章专注 MHA 算子。</p><a href="demo.py">Python demo</a> · <a href="README.md">章节 README</a></section></main><script type="application/json" id="lesson">{"title":"Transformer Self-Attention 机制","era":"2017","question":"如何去掉 RNN，使任意两个 token 可以直接交互并进行并行计算？","idea":"Q/K/V 线性投影、缩放点积、Softmax、因果掩码、多头拼接，是 Decoder Transformer 的计算内核。","formula":"softmax(Q Kᵀ / √d_k + causal_mask) V","steps":[{"label":"生成 QKV","desc":"共享输入通过三组线性投影形成 query/key/value","code":"self.qkv(x).chunk(3, dim=-1)"},{"label":"拆分多头","desc":"把通道拆为 heads × head_dim","code":"reshape(B, T, H, D).transpose(1,2)"},{"label":"注意力分数","desc":"点积并除 sqrt(head_dim) 防止规模过大","code":"(q @ k.transpose(-2,-1))/sqrt(D)"},{"label":"因果掩码","desc":"禁止当前位置看未来 token","code":"masked_fill(mask, -inf)"},{"label":"加权汇总","desc":"softmax 后乘以 V，并拼接各头","code":"weights @ value"}],"pitfall":"Self-Attention 本身不包含位置概念；需要显式位置编码或其他位置机制。本章专注 MHA 算子。","source":"https://huggingface.co/datasets/karpathy/tiny_shakespeare"}</script><script src="../utils/viz.js"></script></body
